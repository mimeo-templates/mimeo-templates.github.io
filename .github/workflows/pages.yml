name: Build and deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout org profile (template list lives there)
        uses: actions/checkout@v4
        with:
          repository: tepiton/.github
          path: org-profile
      - name: Install pandoc
        run: sudo apt-get install -y pandoc
      - name: Build
        run: |
          mkdir -p _site
          { cat index.md; echo; sed -n '/<!-- templates/,$p' org-profile/profile/README.md; } > page.md
          pandoc page.md -o _site/index.html --template=html.template.pandoc --standalone -f gfm --shift-heading-level-by=-1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
